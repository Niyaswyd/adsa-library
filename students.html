<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Details | Alathurpadi Dars</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-locked">
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <img class="brand-mark" src="assets/alathurpadi-logo.png" alt="Alathurpadi Dars logo" />
          <div>
            <span class="brand-name">Alathurpadi Dars</span>
            <small>Knowledge • Character • Excellence</small>
          </div>
        </div>

        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="students.html">Students</a>
          <a href="index.html#library">Library</a>
          <a href="index.html#contact">Contact</a>
        </nav>

        <a href="index.html" class="nav-button">Back Home</a>
      </div>
    </header>

    <main class="student-page">
      <div class="container student-layout">
        <section class="student-card">
          <span class="section-tag">Student Details</span>
          <h1>Student Information</h1>
          <p>Enter the student details required for library registration.</p>

          <form class="student-form">
            <div class="form-row">
              <label for="student-name">Student Name</label>
              <input id="student-name" name="student-name" type="text" placeholder="Enter student name" required />
            </div>

            <div class="form-row">
              <label for="student-roll">Roll Number</label>
              <input
                id="student-roll"
                name="student-roll"
                type="text"
                inputmode="numeric"
                maxlength="3"
                pattern="[0-9]{1,3}"
                placeholder="Enter roll number"
                required
              />
            </div>

            <div class="form-row">
              <label for="library-number">Library Number</label>
              <input
                id="library-number"
                name="library-number"
                type="text"
                inputmode="numeric"
                maxlength="5"
                pattern="[0-9]{1,5}"
                placeholder="Enter library number"
                required
              />
            </div>

            <button type="submit" class="primary-btn full-width">Save Student</button>
          </form>

          <div class="form-message" aria-live="polite"></div>
        </section>

        <aside class="summary-card">
          <span class="section-tag">Preview</span>
          <h2>Registered Student</h2>
          <ul>
            <li><span>Name</span><strong>Not entered</strong></li>
            <li><span>Roll No</span><strong>Not entered</strong></li>
            <li><span>Library No</span><strong>Not entered</strong></li>
          </ul>
        </aside>
      </div>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
